name: Unzip Project

on:
  push:
    paths:
      - "*.zip"

  workflow_dispatch:
    inputs:
      zip_name:
        description: "اسم ملف ZIP الموجود في جذر المستودع"
        required: true
        default: "Infinity_depths-repaired-v0.14.0.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: تحديد ملف ZIP
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.zip_name }}" ]; then
            echo "zip=${{ github.event.inputs.zip_name }}" >> "$GITHUB_OUTPUT"
          else
            first_zip=$(find . -maxdepth 1 -type f -name "*.zip" | sort | head -n 1)

            if [ -z "$first_zip" ]; then
              echo "لم يتم العثور على أي ملف ZIP"
              exit 1
            fi

            first_zip=$(basename "$first_zip")

            echo "zip=$first_zip" >> "$GITHUB_OUTPUT"
          fi

      - name: التحقق من وجود الملف
        shell: bash
        run: |
          ZIP_FILE="${{ steps.vars.outputs.zip }}"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "الملف غير موجود:"
            echo "$ZIP_FILE"
            exit 1
          fi

          echo "تم العثور على:"
          echo "$ZIP_FILE"

      - name: فحص سلامة ZIP
        shell: bash
        run: |
          unzip -t "${{ steps.vars.outputs.zip }}"

      - name: فك الضغط
        shell: bash
        run: |
          ZIP_FILE="${{ steps.vars.outputs.zip }}"

          echo "فك ضغط:"
          echo "$ZIP_FILE"

          rm -rf _extracted
          mkdir -p _extracted

          unzip -o "$ZIP_FILE" -d _extracted

          top_items=$(find _extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$top_items" -eq 1 ]; then
            only_item=$(find _extracted -mindepth 1 -maxdepth 1)

            if [ -d "$only_item" ]; then
              SRC="$only_item"
            else
              SRC="_extracted"
            fi
          else
            SRC="_extracted"
          fi

          rm -rf "$SRC/.github/workflows"

          cp -rf "$SRC"/. .

          rm -rf _extracted

      - name: Commit ورفع التغييرات
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit -m "Auto-unzip: ${{ steps.vars.outputs.zip }}" \
            || echo "لا توجد تغييرات"

          git push
