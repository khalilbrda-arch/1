name: Infinity Depths - Validate & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------
      # 2. Find game ZIP
      # ---------------------------------------------------------
      - name: Find game ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 3 -type f -name 'Infinity_depths-phase13-final.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No game ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 3. Verify ZIP integrity
      # ---------------------------------------------------------
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity: OK"

      # ---------------------------------------------------------
      # 4. Extract game
      # ---------------------------------------------------------
      - name: Extract game
        shell: bash
        run: |
          set -e

          rm -rf extracted_game
          mkdir -p extracted_game

          unzip -q "${{ steps.find_zip.outputs.zip_file }}" -d extracted_game

          echo "Extracted game:"
          find extracted_game -maxdepth 3 -type f | sort | head -200

      # ---------------------------------------------------------
      # 5. Locate actual game root
      # ---------------------------------------------------------
      - name: Locate game root
        id: game_root
        shell: bash
        run: |
          set -e

          INDEX_FILE="$(find extracted_game -type f -name 'index.html' -print -quit)"

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html not found after extraction."
            exit 1
          fi

          GAME_ROOT="$(dirname "$INDEX_FILE")"

          echo "Game root: $GAME_ROOT"

          echo "game_root=$GAME_ROOT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 6. Verify core game files
      # ---------------------------------------------------------
      - name: Verify core game files
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          required_files=(
            "index.html"
            "src/core/Config.js"
            "src/core/GameState.js"
            "src/core/SaveManager.js"
            "src/world/WorldSystem.js"
            "src/world/AdvancedWorldSystem.js"
            "src/world/DefenseMap.js"
            "src/interaction/InteractionController.js"
            "tests/phase13-advanced-world.test.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "Core project files: OK"

      # ---------------------------------------------------------
      # 7. Verify Phase 13 files
      # ---------------------------------------------------------
      - name: Verify Phase 13
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          required_files=(
            "src/world/WorldSystem.js"
            "src/world/AdvancedWorldSystem.js"
            "src/world/DefenseMap.js"
            "src/interaction/InteractionController.js"
            "tests/phase13-advanced-world.test.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing Phase 13 file: $file"
              exit 1
            fi

            echo "Found: $file"
          done

          echo "Phase 13 files: OK"

      # ---------------------------------------------------------
      # 8. Setup Node
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # ---------------------------------------------------------
      # 9. Verify package files
      # ---------------------------------------------------------
      - name: Verify package files
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json not found."
            exit 1
          fi

          if [ ! -f "package-lock.json" ]; then
            echo "ERROR: package-lock.json not found."
            exit 1
          fi

          echo "package.json: OK"
          echo "package-lock.json: OK"

      # ---------------------------------------------------------
      # 10. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ steps.game_root.outputs.game_root }}
        run: npm ci

      # ---------------------------------------------------------
      # 11. Validate project version
      # ---------------------------------------------------------
      - name: Validate Phase 13 version
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "package.json version: $PACKAGE_VERSION"

          if [ "$PACKAGE_VERSION" != "0.13.0" ]; then
            echo "ERROR: Expected package version 0.13.0"
            exit 1
          fi

          echo "Version validation: OK"

      # ---------------------------------------------------------
      # 12. JavaScript syntax check
      # ---------------------------------------------------------
      - name: JavaScript syntax check
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          FAILED=0

          while IFS= read -r file; do
            if ! node --check "$file"; then
              echo "ERROR: Syntax error in $file"
              FAILED=1
            fi
          done < <(find src tests -type f -name '*.js' | sort)

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

          echo "JavaScript syntax: OK"

      # ---------------------------------------------------------
      # 13. Run full regression
      # ---------------------------------------------------------
      - name: Run full regression tests
        working-directory: ${{ steps.game_root.outputs.game_root }}
        run: npm test

      # ---------------------------------------------------------
      # 14. Run Phase 13 dedicated tests
      # ---------------------------------------------------------
      - name: Run Phase 13 tests
        working-directory: ${{ steps.game_root.outputs.game_root }}
        run: npm run test:phase13

      # ---------------------------------------------------------
      # 15. Validate index.html script references
      # ---------------------------------------------------------
      - name: Validate index.html references
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const html = fs.readFileSync('index.html', 'utf8');

          const matches = [
            ...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)
          ];

          const refs = matches.map(m => m[1]);

          const local = refs.filter(src =>
            !/^https?:\/\//i.test(src) &&
            !/^\/\//.test(src)
          );

          const unique = new Set(local);

          console.log(`Total script refs: ${refs.length}`);
          console.log(`Local script refs: ${local.length}`);
          console.log(`Unique local refs: ${unique.size}`);

          if (local.length !== unique.size) {
            throw new Error('Duplicate local script references detected.');
          }

          for (const src of local) {
            const clean = src.split('?')[0].split('#')[0];
            const resolved = path.normalize(path.join('.', clean));

            if (!fs.existsSync(resolved)) {
              throw new Error(`Missing local script: ${src}`);
            }
          }

          console.log('index.html references: OK');
          NODE

      # ---------------------------------------------------------
      # 16. Search for merge conflict markers
      # ---------------------------------------------------------
      - name: Check merge conflict markers
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            src tests index.html \
            --exclude-dir=node_modules; then

            echo "ERROR: Merge conflict markers detected."
            exit 1
          fi

          echo "Conflict marker check: OK"

      # ---------------------------------------------------------
      # 17. Verify no broken Phase 13 legacy file references
      # ---------------------------------------------------------
      - name: Check invalid Phase 13 legacy references
        working-directory: ${{ steps.game_root.outputs.game_root }}
        shell: bash
        run: |
          set -e

          forbidden_files=(
            "src/world/AdvancedWorldEvents.js"
            "src/world/MapRules.js"
            "src/npc/NPCSystem.js"
            "src/story/StorySystem.js"
          )

          for file in "${forbidden_files[@]}"; do
            if [ -f "$file" ]; then
              echo "WARNING: Unexpected legacy file exists: $file"
            fi
          done

          echo "Legacy structure check: OK"

      # ---------------------------------------------------------
      # 18. Configure GitHub Pages
      # ---------------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------
      # 19. Upload actual extracted game
      # ---------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.game_root.outputs.game_root }}

      # ---------------------------------------------------------
      # 20. Deploy
      # ---------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ---------------------------------------------------------
      # 21. Final summary
      # ---------------------------------------------------------
      - name: Deployment summary
        shell: bash
        run: |
          echo "=========================================="
          echo "       INFINITY DEPTHS DEPLOYED"
          echo "=========================================="
          echo ""
          echo "Phase: 13"
          echo "Version: 0.13.0"
          echo ""
          echo "Game URL:"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "=========================================="
